spring:
  application:
    name: latebird-server

  datasource:
    # Port 5434 matches the host port mapped in docker-compose.yml.
    url: ${DB_URL:jdbc:postgresql://localhost:5434/latebird}
    username: ${DB_USER:latebird}
    password: ${DB_PASSWORD:latebird}

  jpa:
    hibernate:
      ddl-auto: update

    # Closes the database session when the service method returns, rather than
    # keeping it open until the HTTP response is written.
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

        jdbc:
          batch_size: 50

        # Hibernate batches only CONSECUTIVE statements against the same table.
        # Sorting by type first means one uninterrupted run of flight INSERTs
        # rather than a batch broken every time a different statement appears.
        order_inserts: true
        order_updates: true

# Settings for the two services this API calls OUT to.
#
# Both blocks follow the same rule: no secret is written here. ${VAR:default}
# means "read environment variable VAR, and if it is unset use default". URLs get
# a working local default; credentials get an EMPTY default, so a missing key
# fails loudly at first use instead of silently authenticating as nobody.
#
# These come from the repo-root .env, which git ignores. Spring Boot does not
# read .env files, so load it into the shell before starting the app:
#     set -a; source ../.env; set +a

# OpenSky Network — live ADS-B operations (Checkpoint 7).
opensky:
  client-id: ${OPENSKY_CLIENT_ID:}
  client-secret: ${OPENSKY_CLIENT_SECRET:}
  base-url: https://opensky-network.org/api
  # OpenSky moved from basic auth to OAuth2 client-credentials in 2025. Access
  # tokens are issued by this Keycloak endpoint, NOT by the API host above.
  token-url: https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token

# The Flask model service in flight-analyzer/ (Checkpoint 6).
analyzer:
  # Port 5001, not Flask's default 5000: macOS binds 5000 for the AirPlay
  # Receiver with SO_REUSEPORT, so both it and Flask listen and connections go to
  # whichever wins the race. Start Flask with --port 5001 to match.
  base-url: ${ANALYZER_URL:http://127.0.0.1:5001}
  # Generous on purpose. A cold Flask service on Render's free tier takes ~50s to
  # answer its first request; timing out at the usual few seconds would report a
  # waking service as a broken one.
  timeout-seconds: ${ANALYZER_TIMEOUT_SECONDS:60}

# Nightly rebuild of the route_reliability aggregate table.
# Overridable so the job can be exercised on demand without waiting for 4am.
reliability:
  cron: ${RELIABILITY_CRON:0 0 4 * * *}

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    # Log every SQL statement Hibernate runs. Verbose, and worth it while I learn.
    org.hibernate.SQL: debug
